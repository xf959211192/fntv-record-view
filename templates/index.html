<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞牛影视 - 观看历史</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Load CSS -->
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <button id="theme-toggle" class="surface" style="position: fixed; top: 20px; right: 20px; z-index: 1000; border-radius: 50%; width: 48px; height: 48px; font-size: 20px; cursor: pointer;">
        <span id="theme-icon">🌙</span>
    </button>
    
    <div class="app-container">
        <!-- Header -->
        <header class="surface p-8 text-center" style="border-radius: var(--radius-lg);">
            <h1 class="font-bold text-4xl mb-2" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">🎬 飞牛影视</h1>
            <p class="text-muted text-lg">智能同步与观看管理平台</p>
        </header>

        <!-- Stats Component -->
        <div id="stats-container" class="stats-grid">
            <!-- stats injected via js -->
        </div>

        <!-- Layout Wrapper -->
        <div class="layout-grid">
            <!-- Left Main Content -->
            <div class="main-column">
                <!-- Filters Component -->
                <div id="filters-container" class="surface p-8 mb-6">
                    <h3 class="mb-4 text-primary font-bold">🔍 检索条件</h3>
                    
                    <div class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));">
                         <div class="flex-col gap-2 flex">
                             <label class="font-medium text-sm">剧集搜索:</label>
                             <input type="text" id="search-title" class="input-base" placeholder="关键词搜索...">
                         </div>
                         
                         <div class="flex-col gap-2 flex">
                             <label class="font-medium text-sm">选择用户:</label>
                             <select id="user-select" class="input-base">
                                 <option value="">所有用户</option>
                             </select>
                         </div>
                         
                         <div class="flex-col gap-2 flex">
                             <label class="font-medium text-sm">起始时间:</label>
                             <input type="datetime-local" id="start-time" class="input-base">
                         </div>
                         
                         <div class="flex-col gap-2 flex">
                             <label class="font-medium text-sm">截止时间:</label>
                             <input type="datetime-local" id="end-time" class="input-base">
                         </div>
                         
                         <div class="flex-col gap-2 flex">
                             <label class="font-medium text-sm">每页数量:</label>
                             <select id="per-page" class="input-base">
                                 <option value="10">10条</option>
                                 <option value="20" selected>20条</option>
                                 <option value="50">50条</option>
                                 <option value="100">100条</option>
                             </select>
                         </div>
                    </div>
                    
                    <div class="flex gap-4 mt-6">
                         <button id="btn-search" class="btn btn-primary flex-1">🔍 搜索记录</button>
                         <button id="btn-clear" class="btn btn-secondary flex-1">🧹 置空参数</button>
                    </div>
                </div>

                <!-- Play History List -->
                <div class="surface p-8 mb-6">
                    <h3 class="mb-6 mt-2 text-primary font-bold text-xl">📺 最新观看历史</h3>
                    <div id="history-container">
                        <!-- history injected via js -->
                    </div>
                    <div id="pagination-container" class="mt-6">
                        <!-- pagination injected via js -->
                    </div>
                </div>
            </div>

            <!-- Right Sidebar Content -->
            <div class="sidebar-column">
                <!-- Trakt Sync Operations -->
                <div id="trakt-container" class="surface p-8 mb-6">
                    <!-- trakt panel injected via js -->
                </div>
            </div>
        </div>
    </div>

    <!-- Trakt Modal Overlay -->
    <div id="trakt-modal" class="modal-overlay" onclick="if(event.target.id === 'trakt-modal') document.getElementById('trakt-modal').classList.remove('open')">
        <div class="modal-content">
            <h3 class="font-bold text-xl mb-4">🔗 连接 Trakt</h3>
            <p id="trakt-modal-text" class="text-muted mb-4">正在申请设备授权，请稍候...</p>
            
            <div class="surface p-6 text-center mb-6">
                <div class="text-sm text-muted mb-2">授权码</div>
                <div id="trakt-user-code" class="text-4xl font-bold tracking-widest text-primary">-</div>
            </div>
            
            <p class="mb-4 text-sm">
                请打开验证页面: <br>
                <a id="trakt-verification-link" href="#" target="_blank" rel="noopener noreferrer" class="text-info" style="word-break: break-all;">-</a>
            </p>
            
            <p id="trakt-modal-expire" class="text-sm text-warning mb-4">验证码有效期剩余: --:--</p>
            
            <div class="flex gap-4">
                <button id="trakt-open-link-btn" class="btn btn-primary flex-1" onclick="if(document.getElementById('trakt-verification-link').href !== '#') window.open(document.getElementById('trakt-verification-link').href)">去验证</button>
                <button class="btn btn-secondary flex-1" onclick="document.getElementById('trakt-modal').classList.remove('open')">关闭</button>
            </div>
        </div>
    </div>

    <!-- Application Logic initialized via ES Module -->
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
