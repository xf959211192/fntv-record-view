services:
  fntv-record-view:
    build:
      context: .
      dockerfile: Dockerfile
    image: fntv-record-view:latest
    container_name: fntv-record-view
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_RUNTIME_DIR: /app/runtime
      SRC_DB_PATH: /app/database/trimmedia.db
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-urn:ietf:wg:oauth:2.0:oob}
      TRAKT_AUTO_SYNC_ENABLED: ${TRAKT_AUTO_SYNC_ENABLED:-true}
      TRAKT_AUTO_SYNC_INTERVAL_SECONDS: ${TRAKT_AUTO_SYNC_INTERVAL_SECONDS:-1800}
      TRAKT_AUTO_SYNC_WATCHED_THRESHOLD: ${TRAKT_AUTO_SYNC_WATCHED_THRESHOLD:-90}
      TRAKT_AUTO_SYNC_LIMIT: ${TRAKT_AUTO_SYNC_LIMIT:-1000}
    volumes:
      - ${SRC_DB_DIR:-/usr/local/apps/@appdata/trim.media/database}:/app/database:ro
      - ${APP_RUNTIME_HOST_DIR:-./runtime}:/app/runtime
    restart: unless-stopped
